name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # An EINER Stelle. Der Pin stand vorher dreifach im Workflow
  # (analyze-and-test, fdroid-build, play-build) und konnte driften.
  # Hinweis: docs/BUILD.md nennt 3.35.x - das ist der SDK-Minimum aus
  # pubspec.yaml, nicht die getestete Version.
  FLUTTER_VERSION: "3.44.6"
  JAVA_VERSION: "17"

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Java 17 (Android-Toolchain)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Flutter installieren
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # `.env` ist seit dem Audit 2026-09-26 KEIN App-Asset mehr (pubspec.yaml
      # registriert es bewusst nicht), aber der Code laesst den dotenv-Pfad
      # als lokale Entwicklungsquelle zu (lib/utils/constants.dart, Quelle 2
      # der Defines-Kette). Ohne Datei ist `_dotenvReady` false, dann liefert
      # `captchaSiteKey` '' und `captchaEnabled` waere false - die Tests, die
      # den Bot-Schutz voraussetzen, laufen dann gegen einen anderen Zustand
      # als lokal. Also weiterhin erzeugen, aber aus dem richtigen Grund.
      - name: .env aus Beispiel erzeugen (dotenv-Fallback fuer Tests)
        run: cp .env.example .env

      - name: Dependencies laden
        run: flutter pub get

      # Der NSFW-Inferenz-Test laedt die native onnxruntime-Bibliothek
      # (exakt die Version, die das Plugin erwartet). Ohne diesen Schritt
      # schlaegt der Test auf dem Runner mit "cannot open shared object
      # file" fehl.
      - name: onnxruntime native library (fuer NSFW-Inferenz-Test)
        run: |
          curl -sSL -o /tmp/ort.tgz \
            https://github.com/microsoft/onnxruntime/releases/download/v1.15.1/onnxruntime-linux-x64-1.15.1.tgz
          mkdir -p /tmp/ort
          tar -xzf /tmp/ort.tgz -C /tmp/ort
          sudo cp /tmp/ort/onnxruntime-linux-x64-1.15.1/lib/libonnxruntime.so* /usr/local/lib/
          sudo ldconfig

      - name: Analyze (muss fehlerfrei sein)
        run: flutter analyze --fatal-infos

      - name: Tests
        run: flutter test

  # ---------------------------------------------------------------
  # v0.9.2: Dependency-Hygiene. Getrennt vom Build, damit ein
  # veraltetes Paket sichtbar wird, ohne den Release zu blockieren -
  # ABER mit hartem Fehler beim Pin-Audit und bei den Security-Checks.
  # ---------------------------------------------------------------
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Flutter installieren
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: .env aus Beispiel erzeugen
        run: cp .env.example .env

      - name: Dependencies laden
        run: flutter pub get

      # 1) Informational. Eine neue Version ist kein Fehler, sondern eine
      #    Entscheidung: Security-Pakete werden bewusst gepinnt.
      - name: Veraltete Pakete (nur Report)
        run: |
          flutter pub outdated --no-dev-dependencies             | tee outdated.txt || true

      - name: Veraltete Pakete als Artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pub-outdated
          path: outdated.txt
          retention-days: 30

      # 2) Hart: die 16 sicherheitsrelevanten Pakete muessen exakt gepinnt
      #    sein. Verhindert, dass jemand ein "^" zurueckbaut.
      - name: Pin-Audit (sicherheitsrelevante Pakete)
        run: python tool/check_dependency_pins.py --lock

      # 3) Hart: die 62 Security-Invarianten laufen bisher nur manuell.
      - name: Security-Invarianten
        run: python tool/check_security_invariants.py

      # Ein Namespace-Wechsel im Keystore OHNE Migrations-Eintrag bedeutet:
      # beim Update sind die Daten unerreichbar (alle Nutzer abgemeldet bzw.
      # neuer Hive-Schluessel -> verschluesselte Boxen unlesbar). Das ist im
      # Review nicht sichtbar, weil der Code je fuer sich korrekt ist.
      - name: Namespace-Migration (Datenverlust beim Update)
        run: python tool/check_namespace_migration.py

      # 4) SBOM fuer die F-Droid-Einreichung vorbereiten.
      #    CycloneDX listet transitive Abhaengigkeiten inkl. der sieben
      #    lokalen Forks, die `pub outdated` nicht sieht.
      #    continue-on-error: ist Vorbereitung, kein Gate - ein fehlendes
      #    Python-Tool darf den Release nicht blockieren.
      - name: SBOM (CycloneDX)
        continue-on-error: true
        run: |
          pip install --quiet cyclonedx-bom
          cyclonedx-py environment --output-file sbom.json || \
            cyclonedx-py --output-file sbom.json
          test -s sbom.json && echo "SBOM erzeugt: $(wc -c < sbom.json) Bytes"

      - name: SBOM als Artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.json
          retention-days: 90

  fdroid-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Java 17 (Android-Toolchain)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Flutter installieren
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: .env aus Beispiel erzeugen
        run: cp .env.example .env

      - name: Dependencies laden
        run: flutter pub get

      # Hält die Google-freie Variante dauerhaft kompilierbar
      - name: F-Droid Debug-Build (ohne Firebase)
        run: >
          flutter build apk --debug
          --flavor fdroid --dart-define=FDROID=true

  play-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Java 17 (Android-Toolchain)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Flutter installieren
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # google-services.json ist gitignored (echte Firebase-Werte); der
      # Debug-Build kommt mit dem Dummy-Beispiel aus - er muss nur
      # KOMPILEIERBAR sein, nicht gegen echte Firebase-Projekte laufen.
      - name: google-services.json aus Beispiel erzeugen
        run: cp android/app/google-services.json.example android/app/google-services.json

      - name: .env aus Beispiel erzeugen
        run: cp .env.example .env

      - name: Dependencies laden
        run: flutter pub get

      # Hält die Play-Variante dauerhaft kompilierbar (Pendant zu
      # fdroid-build; kompiliert MIT Google-Services-Plugin).
      - name: Play Debug-Build (mit Firebase-Plugin)
        run: >
          flutter build apk --debug
          --flavor play

  # Ohne diesen Job konnte assetlinks.json woertlich duplizierte
  # Fingerprints und eine unausgefuellte AASA-Vorlage enthalten, ohne dass
  # irgendetwas auffiel. Beides ist passiert: die Vorlage
  # "REPLACE_WITH_APPLE_TEAM_ID" laeuft seit dem ersten Commit so mit und
  # macht iOS-Passkeys still wirkungslos.
  #
  # Der Job ist wieder blockierend. Zuvor stand hier
  # continue-on-error: true, weil die AASA-Vorlage als Fehler gewertet
  # wurde und die Team-ID noch fehlt. Zwei Argumente dagegen:
  # eine dauerhaft rote Ampel wird abgelesen und dann ignoriert, und sie
  # faellt genau dann nicht mehr auf, wenn sie einmal wirklich wichtig
  # wird. Die Vorlage ist jetzt eine WARNUNG im Pruefer, kein Fehler -
  # damit ist dieser Job gruen, ohne dass etwas verloren geht.
  passkey-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Nur keytool (JDK ist auf ubuntu-latest vorinstalliert) - der
      # Fingerprint-Vergleich gegen die Keystores laeuft nur, wenn
      # android/key.properties existiert. Im Repo ist die Datei absichtlich
      # gitignored, also laeuft der Job hier strukturell: JSON-Validitaet,
      # Hex-Laenge, Duplikate, Vorlagen.
      - name: Passkey-Assets pruefen
        run: python3 tool/check_passkey_assetlinks.py

  # Von 15 Pruefern unter tool/ liefen vor diesem Job nur vier in der CI.
  # check_migrations_sql, check_migration_safety und check_push_readiness
  # wurden ausschliesslich lokal ausgefuehrt - und genau dort ist etwas
  # kaputtgegangen, ohne dass es jemand bemerkt haette: sqlglot ist eine
  # ungepinnte Abhaengigkeit, und 30.18.0 kann
  # "LANGUAGE sql SECURITY DEFINER" nicht parsen. Die SQL ist seit dem
  # Deploy unveraendert, der Check ist trotzdem umgekippt.
  #
  # Die beiden externen Parser sind jetzt in tool/requirements.txt
  # gepinnt, damit das nicht erneut passiert.
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gepinnte Pruef-Abhaengigkeiten
        run: pip install -r tool/requirements.txt

      # keytool wird von check_passkey_assetlinks.py nur optional genutzt
      # (java ist auf dem Runner vorhanden, android/key.properties ist
      # gitignored) - es verursacht hier keinen Fehler.
      - name: SQL-Parser
        run: |
          python3 tool/check_migrations_sql.py
          python3 tool/check_migration_safety.py

      # Selftests mit Negativfaellen: sie pruefen, dass die Pruefer nicht
      # nur gruen melden, sondern echte Fehler auch finden.
      - name: Selftests der Pruefer
        run: |
          python3 tool/check_migrations_sql_selftest.py
          python3 tool/check_namespace_migration_selftest.py
          python3 tool/check_push_readiness_selftest.py

      - name: Uebrige statische Pruefer
        run: |
          python3 tool/check_security_invariants.py
          python3 tool/check_dependency_pins.py
          python3 tool/check_push_readiness.py
          python3 tool/check_passkey_assetlinks.py
          python3 tool/check_dashes.py
          python3 tool/check_texts.py
          python3 tool/check_keys.py
