name: thestia
description: Eine moderne, datenschutzfreundliche Dating-App mit Blind Mode (Persönlichkeit zuerst).
publish_to: 'none'
version: 0.9.2+30

environment:
  sdk: ^3.10.0
  flutter: ^3.35.0

dependencies:
  flutter:
    sdk: flutter
  # Material-/Widgets-/Cupertino-Localizations fuer de/en: Ohne diese
  # Delegates laedt Flutter bei locale 'de' KEIN MaterialLocalizations
  # ("No MaterialLocalizations found" - AppBar/PopupMenus crashten).
  flutter_localizations:
    sdk: flutter
  # cupertino_icons: Wird von keinem Code direkt genutzt, aber mindestens
  # ein Paket importiert flutter/cupertino.dart transitiv - der Icon-Tree-
  # Shaker erwartet dann den Font ("Expected to find fonts for ...").
  # Mit dieser Dependency ist die Font-Referenz aufgeloest; ungenutzte
  # Glyphen werden beim Release ohnehin weggeschnitten.
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^17.3.0

  # Lokale, sichere Datenspeicherung (Einstellungen, Profil, Auth-Token)
  shared_preferences: 2.5.5

  # Schöne Icons & Utilities
  # 0.20.2 ist von flutter_localizations (Flutter SDK) gepinnt - eine
  # hoehere Constraint wuerde die Abhaengigkeitsaufloesung brechen.
  intl: ^0.20.2
  share_plus: ^13.2.1

  # App-Informationen für Bug-Reports (Version)
  package_info_plus: ^10.0.0

  # Echtes Geraetemodell fuer Angemeldete Geraete (v0.8.1)

  # Transit Spark (v0.9.0): BLE-Advertising + -Scanning
  flutter_blue_plus: 1.36.8
  device_info_plus: ^13.2.0

  # Öffnen externer Links (GitHub Issues)
  url_launcher: 6.3.2

  # Bildauswahl für Bug-Reports
  image_picker: ^1.1.2

  # Firebase für Server-Zeit & Cloud-Functions
  # ENTFERNT: Wird nicht mehr benötigt, ersetzt durch Supabase.

  # === NEUE DEPENDENCIES FÜR SICHERHEITS-FEATURES ===

  # E2E-Verschlüsselung (Signal Protocol)
  libsignal_protocol_dart: 0.8.2

  # WebRTC für P2P-Kommunikation
  flutter_webrtc: ^1.6.0

  # WebSocket für Signaling-Server-Kommunikation

  # HTTP-Client für REST-API (mit Zertifikat-Pinning)
  http: 1.6.0

  # Kryptographische Hash-Funktionen (für Zertifikat-Pinning)
  crypto: 3.0.7

  # Sichere, verschlüsselte lokale Speicherung von Tokens (statt SharedPreferences)
  flutter_secure_storage: 11.0.0

  # Hive für lokale verschlüsselte Speicherung der Signal-Keys
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Kamera & Video für Verifizierung
  camera: 0.12.0+2
  video_player: ^2.9.1
  # Frame-Entnahme aus dem Verifizierungsvideo (Mehrframe-Median der
  # Altersschätzung, MIT): Thumbnails direkt aus der MP4-Datei, kein
  # zusätzliches KI-Modell nötig.
  video_thumbnail: ^0.5.6

  # Berechtigungen
  permission_handler: 13.0.1

  # Standort
  geolocator: ^14.0.3

  # Geocoding für Ortserkennung
  geocoding: ^4.0.0

  # Bildverarbeitung für Moderation (Placeholder für ML-Kit)
  image: 4.10.1

  # NSFW on-device (v0.8.0): lokale Inferenz des Bild-Sicherheits-Modells
  # (image-safety-classifier-xs, ONNX-Format) - nur bei manueller Meldung.
  onnxruntime: 1.4.1

  # Path Provider für Dateipfade
  path_provider: 2.1.6

  # Benachrichtigungen (Nachrichten, Likes, Matches, Event-Erinnerungen)
  flutter_local_notifications: 22.3.0

  # EU-Push über Supabase Push (Verarbeitung in eu-central-1, Free Tier).
  # FCM dient nur als Zustell-Transport (kostenloses Firebase-Konto nötig).
  firebase_core: 4.13.0
  firebase_messaging: 16.5.0

  # Geplante Benachrichtigungen (Dating-Hour-Erinnerung auch bei
  # geschlossener App)
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

  # Nativer Splash (Preserve/Remove-API wird zur Laufzeit in main.dart genutzt,
  # daher als reguläre Dependency statt dev_dependency)
  flutter_native_splash: ^2.4.8

  # Crypto für Key-Backup-Verschlüsselung
  pointycastle: 4.0.0

  # Supabase für Auth + Datenbank (RLS-abgesichert) + Supabase Push (EU)
  flutter_dotenv: ^6.0.1
  supabase_flutter: ^2.17.1

  # Passkeys (WebAuthn): native Passkey-Dialoge (FaceID/TouchID/Biometrie).
  # Der Plugin-Code läuft auf iOS 16+ / Android; es reicht die
  # Plattform-Prompts an Supabase Auth weiter (siehe lib/services/passkey_auth.dart).
  # ACHTUNG: Benötigt Flutter 3.35+ / Dart 3.9+ und supabase_flutter mit
  # Passkey-Unterstützung (signInWithPasskey/registerPasskey).
  # Direkte Abhängigkeit: ThestiaPasskeyAuthenticator implementiert die
  # Interface-Klasse des Platform-Interfaces (ohne Pre-Cancel-Verhalten).
  # NUR das Platform-Interface wird direkt gebraucht - das konkrete
  # passkeys-Paket kommt transitiv über supabase_flutter (Security 2026-09-26:
  # ungenutzte Direkt-Abhängigkeiten = unnötige Angriffsfläche).
  passkeys_platform_interface: ^2.9.0

  # QR-Code (Profil teilen + Scannen)
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  record: ^7.1.1
  just_audio: ^0.10.6
  webview_flutter: ^4.14.1
  image_cropper: ^12.2.1
  unifiedpush: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Lint-Regeln für sauberen, modernen Code
  flutter_lints: ^6.0.0

  # Code Generation für Hive
  build_runner: ^2.4.13
  hive_generator: ^2.0.1

  # Launcher-Icons aus einem Basis-Bild generieren
  flutter_launcher_icons: ^0.14.4

# Lokale Forks der drei Plugins, die noch kein Built-in Kotlin unterstützen
# (KGP-Warnung beim Build). Die Forks enthalten KEINE KGP-Apply-Zeilen mehr;
# der Flutter-Plugin-Loader wendet KGP dann selbst an (builtInKotlin=false).
# --- v0.9.2: Sicherheitsrelevante Abhaengigkeiten exakt gepinnt ---------------
# Nicht mit "^": bei Krypto-, Keystore- und Transport-Paketen kann ein
# Minor-Bump das Laufzeitverhalten aendern, ohne dass es im Diff auftaucht.
# Gepinnt wird die aufgeloeste Version aus pubspec.lock, also der Stand, der
# tatsaechlich getestet und ausgeliefert wird. Aufloesen bewusst per
# `flutter pub upgrade <paket>` + Review, nicht durch bloesses Editieren.

dependency_overrides:
  flutter_timezone:
    path: third_party/flutter_timezone
  flutter_webrtc:
    path: third_party/flutter_webrtc
  mobile_scanner:
    path: third_party/mobile_scanner
  # KGP-freier Fork: passkeys_android zieht upstream bedingungslos
  # kotlin-android an (trotz reinem Java-Quellcode) und loest damit die
  # Flutter-KGP-Warnung aus. Siehe third_party/passkeys_android.
  passkeys_android:
    path: third_party/passkeys_android
  # Stub: unifiedpush_linux zieht webpush_encryption -> webcrypto
  # (Native Assets mit CMake-Bedarf) und bricht dadurch Tests/Builds auf
  # Windows. Linux-Desktop ist kein Target - siehe third_party/unifiedpush_linux.
  unifiedpush_linux:
    path: third_party/unifiedpush_linux
  # KGP-freier Fork: unifiedpush_android zieht upstream einen eigenen
  # buildscript-Klasspath (AGP + KGP) -> Flutter-KGP-Warnung.
  # Siehe third_party/unifiedpush_android.
  unifiedpush_android:
    path: third_party/unifiedpush_android
  # AGP-9-Fork: video_thumbnail zieht upstream jcenter() + AGP-4.1.0-
  # Klasspath (Build-Fehler unter AGP 9/neuem DSL) und hat ein
  # Dart-2-SDK-Constraint. Siehe third_party/video_thumbnail.
  video_thumbnail:
    path: third_party/video_thumbnail

flutter_launcher_icons:
  # Thestia-Branding (Quelle: assets/images/thestia_icon_base.png):
  #  - Legacy/iOS: volles Basis-PNG (Verlauf + Schriftzug).
  #  - iOS: opake 1024er-Variante (thestia_icon_ios.png, Apple maskt selbst).
  image_path: "assets/images/thestia_icon_base.png"
  image_path_ios: "assets/images/thestia_icon_ios.png"
  android: true
  ios: true
  remove_alpha_ios: true
  # Adaptive Icon (Android 8+): Hintergrund = Markenverlauf (volflaechig),
  # Vordergrund = Herz + Schriftzug in der Safe-Zone, damit die KREIS-Maske
  # des Launchers nichts abschneidet. Erzeugt von
  # tool/generate_launcher_icon.py (dort auch monochrome + Legacy-Round-Icon).
  adaptive_icon_background: "assets/images/thestia_icon_background.png"
  adaptive_icon_foreground: "assets/images/thestia_icon_foreground.png"
  # Safe-Zone steckt bereits im Foreground -> kein zusaetzlicher Inset.
  adaptive_icon_foreground_inset: 0
  platforms:
    web:
      generate: false
    windows:
      generate: false
    macos:
      generate: false
    linux:
      generate: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/thestia_icon_base.png
    - assets/images/thestia_splash.png
    - assets/images/thestia_splash_android12.png
    - assets/models/
    # SECURITY (Audit 2026-09-26): KEIN .env als App-Asset. Eine gebündelte
    # Konfigurationsdatei ist aus APK/IPA extrahierbar. Die Werte werden
    # ueber --dart-define zur Compile-Zeit injiziert (tool/build_release.ps1),
    # .env bleibt rein lokale Entwicklungsquelle (nicht Teil des Bundles).

  # Hinweis: In einer echten App würden hier weitere Assets (Bilder, Fonts) registriert.
